<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de recarga - Usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/logo.svg">
</head>
<body>
    <header class="cabecera">
        <a href="inicio.html" class="logo"><img src="img/logo.svg" alt=""> Punto de recarga</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenido">
        <h1>Usuarios</h1>
        <p class="subtitulo">Crea, edita, da de baja, haz admin o elimina usuarios.</p>

        <button id="nuevo" class="pequeno">+ Nuevo usuario</button>

        <form id="formulario" class="formulario-admin" hidden>
            <h2 id="titulo-formulario">Editar usuario</h2>
            <label for="nombre">Nombre</label>
            <input id="nombre" required>
            <label for="email">Email</label>
            <input id="email" type="email" required>
            <label for="password" id="texto-password">Contraseña nueva</label>
            <input id="password" type="password" minlength="4" placeholder="Déjala vacía para no cambiarla">
            <div id="campo-rol" hidden>
                <label for="rol">Rol</label>
                <select id="rol">
                    <option value="user">Usuario</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" id="enviar">Guardar cambios</button>
            <button type="button" id="cancelar-edicion" class="secundario">Cancelar</button>
        </form>
        <p id="mensaje" class="error"></p>

        <table class="tabla">
            <thead>
            <tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Horas</th><th>Penalización</th><th></th></tr>
            </thead>
            <tbody id="usuarios"></tbody>
        </table>
    </main>

    <script type="module" src="js/admin-usuarios.js"></script>
</body>
</html>
