<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de recarga - Registro</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="img/logo.svg">
</head>
<body class="pantalla-centrada">
  <main class="tarjeta">
    <img src="img/cargador.svg" alt="Coche eléctrico cargando" class="ilustracion">
    <span class="insignia"><span class="material-symbols-outlined">eco</span> Movilidad sostenible</span>
    <h1>Crear cuenta</h1>
    <p class="subtitulo">El primer usuario que se registra será el administrador</p>

    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <div class="campo"><span class="material-symbols-outlined">person</span><input type="text" id="nombre" required></div>

      <label for="email">Email</label>
      <div class="campo"><span class="material-symbols-outlined">mail</span><input type="email" id="email" required></div>

      <label for="password">Contraseña</label>
      <div class="campo"><span class="material-symbols-outlined">lock</span><input type="password" id="password" minlength="4" required></div>

      <label for="password2">Repite la contraseña</label>
      <div class="campo"><span class="material-symbols-outlined">lock</span><input type="password" id="password2" minlength="4" required></div>

      <p id="error" class="error"></p>

      <button type="submit">Registrarme</button>
    </form>

    <p class="enlace">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    <p class="nota"><span class="material-symbols-outlined">verified</span> Los turnos se reparten de forma justa y automática según el horario de cada uno.</p>
  </main>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
