<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de recarga - Registro</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pantalla-centrada">
  <main class="tarjeta">
    <h1>⚡ Crear cuenta</h1>
    <p class="subtitulo">El primer usuario que se registra será el administrador</p>

    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="4" required>

      <label for="password2">Repite la contraseña</label>
      <input type="password" id="password2" minlength="4" required>

      <p id="error" class="error"></p>

      <button type="submit">Registrarme</button>
    </form>

    <p class="enlace">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </main>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
