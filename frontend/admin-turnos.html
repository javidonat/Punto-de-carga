<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de recarga - Turnos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/logo.svg">
</head>
<body>
    <header class="cabecera">
        <a href="inicio.html" class="logo"><img src="img/logo.svg" alt=""> Punto de recarga</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenido">
        <h1>Turnos de la semana</h1>
        <div class="semana">
            <button id="anterior">← Anterior</button>
            <strong id="titulo-semana"></strong>
            <button id="siguiente">Siguiente →</button>
        </div>
        <button id="generar">Rehacer el reparto de esta semana</button>
        <button id="mostrar-formulario" class="secundario">Añadir un turno a mano</button>

        <form id="formulario" class="formulario-admin" hidden>
            <label for="usuario">Usuario</label>
            <select id="usuario" required></select>
            <label for="punto">Punto de recarga</label>
            <select id="punto" required></select>
            <label for="fecha">Día</label>
            <input id="fecha" type="date" required>
            <label>Hora</label>
            <div id="horas" class="horas"></div>
            <button type="submit">Añadir turno</button>
        </form>
        <p id="mensaje" class="error"></p>

        <table class="tabla">
            <thead>
            <tr><th>Día</th><th>Hora</th><th>Punto</th><th>Usuario</th><th>Tipo</th><th></th></tr>
            </thead>
            <tbody id="turnos"></tbody>
        </table>

        <h2>Ajustes del reparto</h2>
        <form id="form-ajustes" class="formulario-admin">
            <label for="algoritmo">A quién se le da cada hora libre</label>
            <select id="algoritmo">
                <option value="hours">A quien menos horas lleva en total</option>
                <option value="week">A quien menos horas lleva esta semana</option>
                <option value="random">Al azar</option>
            </select>
            <label for="max-semana">Máximo de horas por semana (0 = sin límite)</label>
            <input id="max-semana" type="number" min="0" max="168" required>
            <label for="max-seguidas">Máximo de horas seguidas en el mismo punto</label>
            <input id="max-seguidas" type="number" min="1" max="24" required>
            <button type="submit">Guardar ajustes</button>
        </form>
    </main>

    <script type="module" src="js/admin-turnos.js"></script>
</body>
</html>
