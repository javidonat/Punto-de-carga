<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de recarga - Inicio</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="img/logo.svg">
</head>
<body>
  <header class="cabecera">
    <a href="inicio.html" class="logo"><img src="img/logo.svg" alt=""> Punto de recarga</a>
    <nav id="menu"></nav>
  </header>

  <main class="contenido">
    <div class="bienvenida">
      <div>
        <h1>Hola, <span id="nombre"></span></h1>
        <p id="rol" class="subtitulo"></p>
      </div>
      <img src="img/cargador.svg" alt="Coche eléctrico cargando" class="ilustracion">
    </div>

    <section id="seccion-usuario" hidden>
      <div id="ausente"></div>
      <div id="aviso"></div>

      <h2>Turnos por confirmar</h2>
      <div id="pendientes"></div>

      <h2>Tu próximo turno</h2>
      <div id="proximo"></div>
      <p>Horas cargadas en total: <strong id="horas">…</strong></p>
    </section>

    <div id="resumen-admin"></div>

    <h2>Avisos</h2>
    <div id="avisos"></div>
    <p id="mensaje" class="error"></p>
  </main>

  <script type="module" src="js/inicio.js"></script>
</body>
</html>
