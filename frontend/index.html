<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de recarga - Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pantalla-centrada">
  <main class="tarjeta">
    <h1>⚡ Punto de recarga</h1>
    <p class="subtitulo">Inicia sesión para ver tus turnos de carga</p>

    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" required>

      <p id="error" class="error"></p>

      <button type="submit">Entrar</button>
    </form>

    <p class="enlace">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
