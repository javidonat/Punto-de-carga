<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de recarga - Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="img/logo.svg">
</head>
<body class="pantalla-centrada">
  <main class="tarjeta">
    <img src="img/cargador.svg" alt="Coche eléctrico cargando" class="ilustracion">
    <span class="insignia"><span class="material-symbols-outlined">eco</span> Movilidad sostenible</span>
    <h1>Punto de recarga</h1>
    <p class="subtitulo">Inicia sesión para ver tus turnos de carga</p>

    <form id="form-login">
      <label for="email">Email</label>
      <div class="campo"><span class="material-symbols-outlined">mail</span><input type="email" id="email" required></div>

      <label for="password">Contraseña</label>
      <div class="campo"><span class="material-symbols-outlined">lock</span><input type="password" id="password" required></div>

      <p id="error" class="error"></p>

      <button type="submit">Entrar</button>
    </form>

    <p class="enlace">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    <p class="nota"><span class="material-symbols-outlined">verified</span> Los turnos se reparten de forma justa y automática según el horario de cada uno.</p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
