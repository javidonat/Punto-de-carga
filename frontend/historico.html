<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de recarga - Histórico</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/logo.svg">
</head>
<body>
    <header class="cabecera">
        <a href="inicio.html" class="logo"><img src="img/logo.svg" alt=""> Punto de recarga</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenido">
        <h1>Histórico</h1>
        <section id="seccion-usuario" hidden>
            <p>Horas de carga en total: <strong id="total">…</strong></p>
            <p>Horas de penalización: <strong id="penalizacion">…</strong></p>

            <h2>Mis horas por semana</h2>
            <table class="tabla">
                <thead>
                <tr><th>Semana</th><th>Horas</th></tr>
                </thead>
                <tbody id="semanas"></tbody>
            </table>
        </section>

        <section id="seccion-admin" hidden>
            <h2>Horas de cada usuario</h2>
            <table class="tabla">
            <thead>
                <tr><th>Usuario</th><th>Email</th><th>Horas</th><th>Penalización</th></tr>
            </thead>
            <tbody id="usuarios"></tbody>
            </table>
        </section>

        <h2>Gráfica de horas cargadas</h2>
        <div class="grafica">
            <select id="periodo">
                <option value="day">Por día</option>
                <option value="week" selected>Por semana</option>
                <option value="month">Por mes</option>
                <option value="year">Por año</option>
            </select>
            <select id="usuario-grafica" hidden>
                <option value="">Todos los usuarios</option>
            </select>
            <canvas id="grafica"></canvas>
        </div>

        <p id="mensaje" class="error"></p>
    </main>

    <!-- Chart.js desde el CDN: crea la variable global Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script type="module" src="js/historico.js"></script>
</body>
</html>
